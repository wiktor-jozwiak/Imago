# cargo-deny: dependency licenses, security advisories and sources.
# Run locally with `cargo deny check` (install: `cargo install cargo-deny`).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices for build-time proc-macros we cannot replace; neither
# has a known vulnerability and neither ships code in the binaries.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: proc-macro used by rav1d, rav1d-safe and zenpixels-convert" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: used by gtk-rs macros (Tauri on Linux)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Imago is GPL-3.0-or-later (ADR-002): every license below is compatible with it.
# AGPL-3.0 components (animated AVIF, JPEG XL encoder) are combined under
# GPLv3 section 13 (ADR-016).
allow = [
    "GPL-3.0",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "IJG",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "NCSA",
    "LGPL-2.1-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
