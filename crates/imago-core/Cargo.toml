[package]
name = "imago-core"
description = "Imago image optimization engine: format detection, decoding, resizing, encoding and safe output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["avif", "jxl", "heic"]
# AVIF still images and animations: encoding (zenravif/rav1e), still decoding
# (avif-decode/rav1d) and animation decoding (zenavif). Needs NASM on x86/x86_64.
avif = ["dep:zenavif", "dep:zenavif-parse", "dep:avif-decode", "dep:almost-enough", "dep:imgref", "dep:zenpixels"]
# JPEG XL decoding (jxl-oxide) and encoding (jxl-encoder), including animations.
jxl = ["dep:jxl-oxide", "dep:jxl-encoder"]
# HEIC/HEIF decoding (heic-rs). Read-only: HEIC is never written.
heic = ["dep:heic-rs"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

image.workspace = true
mozjpeg.workspace = true
webp.workspace = true
oxipng.workspace = true
imagequant.workspace = true
gif.workspace = true
tiff.workspace = true
fast_image_resize.workspace = true
moxcms.workspace = true
img-parts.workspace = true
crc32fast.workspace = true
png.workspace = true
zenavif = { workspace = true, optional = true }
zenavif-parse = { workspace = true, optional = true }
avif-decode = { workspace = true, optional = true }
almost-enough = { workspace = true, optional = true }
imgref = { workspace = true, optional = true }
zenpixels = { workspace = true, optional = true }
enough.workspace = true
rgb.workspace = true
jxl-oxide = { workspace = true, optional = true }
jxl-encoder = { workspace = true, optional = true }
heic-rs = { workspace = true, optional = true }

tempfile.workspace = true
same-file.workspace = true
walkdir.workspace = true
zip.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
directories.workspace = true
serde_json.workspace = true

[dev-dependencies]
image.workspace = true
img-parts.workspace = true
tempfile.workspace = true
criterion.workspace = true

[[bench]]
name = "codecs"
harness = false

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
