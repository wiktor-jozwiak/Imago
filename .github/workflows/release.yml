name: Release

# Builds installers (Windows MSI + NSIS, macOS DMG, Linux DEB/RPM/AppImage) and
# CLI archives when a version tag is pushed, and attaches them to a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App installer (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macos-x64
            os: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev build-essential rpm
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Imago ${{ github.ref_name }}"
          releaseBody: "Imago Image Optimizer — Fast. Local. Smaller images."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  cli:
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p imago-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="imago-cli-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bin="target/${{ matrix.target }}/release/imago"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          cp "${bin}" LICENSE README.md docs/CLI.md "dist/${name}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then 7z a "${name}.zip" "${name}"; else tar czf "${name}.tar.gz" "${name}"; fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/imago-cli-*
