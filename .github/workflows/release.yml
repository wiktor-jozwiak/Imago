name: Release

# Builds installers (Windows MSI + NSIS, macOS universal DMG, Linux DEB/RPM/AppImage)
# and CLI archives when a version tag is pushed, and attaches them to a draft release.
# The CLI is built in the same job as the app, so the dependencies compile once.
#
# Code signing is optional and switches itself on when the matching secrets
# exist (see docs/SIGNING.md):
#   Windows, Azure Trusted Signing: AZURE_TENANT_ID, AZURE_CLIENT_ID,
#     AZURE_CLIENT_SECRET, TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT,
#     TRUSTED_SIGNING_PROFILE
#   Windows, certificate file (.pfx): WINDOWS_CERTIFICATE (base64),
#     WINDOWS_CERTIFICATE_PASSWORD
#   macOS: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#     APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# Without them the builds are unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            tauri-args: ""
            rust-targets: ""
          - name: macos-universal
            os: macos-latest
            tauri-args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: linux-x64
            os: ubuntu-22.04
            tauri-args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    env:
      # Flags only: the secrets themselves are passed to the steps that use them.
      SIGN_AZURE: ${{ secrets.TRUSTED_SIGNING_ACCOUNT != '' }}
      SIGN_PFX: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      SIGN_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev build-essential rpm
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ---- Windows signing (optional) -----------------------------------
      - name: Windows signing with Azure Trusted Signing
        if: runner.os == 'Windows' && env.SIGN_AZURE == 'true'
        shell: pwsh
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --locked
          # Tauri calls the command for every binary and installer (%1 = file).
          $command = "trusted-signing-cli -e $env:TRUSTED_SIGNING_ENDPOINT -a $env:TRUSTED_SIGNING_ACCOUNT -c $env:TRUSTED_SIGNING_PROFILE -d Imago %1"
          $config = @{ bundle = @{ windows = @{ signCommand = $command } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path src-tauri/tauri.signing.json -Value $config -Encoding utf8
          "TAURI_SIGNING_CONFIG=--config src-tauri/tauri.signing.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Windows signing with a certificate file
        if: runner.os == 'Windows' && env.SIGN_AZURE != 'true' && env.SIGN_PFX == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "imago-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $certificate.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path src-tauri/tauri.signing.json -Value $config -Encoding utf8
          "TAURI_SIGNING_CONFIG=--config src-tauri/tauri.signing.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ---- macOS signing and notarization (optional) ---------------------
      - name: macOS signing
        if: runner.os == 'macOS' && env.SIGN_APPLE == 'true'
        shell: bash
        run: |
          # tauri-action reads these; they are exported only when a certificate exists.
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # ---- Desktop app ------------------------------------------------------
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Imago ${{ github.ref_name }}"
          releaseBody: |
            Imago Image Optimizer — Fast. Local. Smaller images.

            * Windows: `Imago_*_x64-setup.exe` (recommended) or `.msi`
            * macOS (Apple Silicon and Intel): `Imago_*_universal.dmg`
            * Linux: `.AppImage`, `.deb` or `.rpm`
            * Command line: `imago-cli-*` archives

            Checksums: `SHA256SUMS.txt`.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri-args }} ${{ env.TAURI_SIGNING_CONFIG }}

      # ---- Command-line tool (reuses the dependencies built above) ----------
      - name: Build the CLI
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo build --release --locked -p imago-cli --target aarch64-apple-darwin
            cargo build --release --locked -p imago-cli --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/imago \
              target/aarch64-apple-darwin/release/imago target/x86_64-apple-darwin/release/imago
            echo "CLI_BIN=target/universal-apple-darwin/release/imago" >> "$GITHUB_ENV"
          else
            cargo build --release --locked -p imago-cli
            bin=target/release/imago
            [ -f "${bin}.exe" ] && bin="${bin}.exe"
            echo "CLI_BIN=${bin}" >> "$GITHUB_ENV"
          fi
      - name: Sign the Windows CLI (Azure Trusted Signing, optional)
        if: runner.os == 'Windows' && env.SIGN_AZURE == 'true'
        shell: pwsh
        env:
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: trusted-signing-cli -e $env:TRUSTED_SIGNING_ENDPOINT -a $env:TRUSTED_SIGNING_ACCOUNT -c $env:TRUSTED_SIGNING_PROFILE -d "Imago CLI" $env:CLI_BIN
      - name: Package the CLI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="imago-cli-${version}-${{ matrix.name }}"
          mkdir -p "dist/${name}"
          cp "${CLI_BIN}" LICENSE README.md THIRD_PARTY.md docs/CLI.md "dist/${name}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "${name}.zip" "${name}"; else tar czf "${name}.tar.gz" "${name}"; fi
      - name: Upload the CLI to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gh finds draft releases by tag (tauri-action created it above).
        run: |
          shopt -s nullglob
          archives=(dist/imago-cli-*.zip dist/imago-cli-*.tar.gz)
          gh release upload "${GITHUB_REF_NAME}" "${archives[@]}" --repo "${{ github.repository }}" --clobber

  checksums:
    name: SHA-256 checksums
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checksums of every release file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
